name: Network Test Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  integration-test:
    name: Run Fabric Performance Regression
    runs-on: self-hosted
    environment:
      name: velocity-lab-env

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Fabric Connectivity Regression
        run: |
          echo "Executing automated network tests against EVE-NG nodes..."
          /home/kumar/velocity-env/bin/python3 scripts/verify_fabric.py

      - name: Teardown Lab Environment
        if: always()
        run: |
          echo "Workflow finished. Releasing Keysight Velocity reservation..."
          curl -s -X POST "http://127.0.0.1:8443/teardown/active" || true
