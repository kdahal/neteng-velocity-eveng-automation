name: Network Test Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      priority:
        description: "Velocity Reservation Priority"
        required: true
        default: "MEDIUM"
        type: choice
        options:
          - "LOW"
          - "MEDIUM"
          - "HIGH"

jobs:
  integration-test:
    name: Run Fabric Performance Regression
    runs-on: self-hosted
    environment:
      # Embed the priority directly into the environment name or deployment
      name: velocity-lab-env

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Fabric Connectivity Regression
        run: |
          echo "Executing automated network tests against EVE-NG nodes..."
          /home/kumar/velocity-env/bin/python3 scripts/verify_fabric.py